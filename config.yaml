# ─────────────────────────────────────────────────────────────────────────────
# CUSTOM CHANNELS
# These are 24/7 loop channels with no real EPG data.
# The script generates a repeating hourly schedule for the next 7 days.
# ─────────────────────────────────────────────────────────────────────────────
custom_channels: []

