# EPG Generator Configuration
# ─────────────────────────────────────────────────────────────────────────────
# HOW IT WORKS
#   1. The script downloads each URL in 'sources' (XMLTV format, .gz supported)
#   2. It extracts only the channels listed under 'live_channels'
#   3. It generates a dummy hourly schedule for 'custom_channels'
#   4. Everything is merged into CPTV.xml, which GitHub Actions refreshes daily
#
# FINDING CHANNEL IDs
#   Run the discover tool against any source feed to see all available IDs:
#     python generate_epg.py --discover <source_url>
#
# ADDING MORE COUNTRIES
#   Add more entries to 'sources' and add channel entries with matching
#   channel_id values.  The iptv-org EPG project covers 100+ countries:
#     https://github.com/iptv-org/epg  →  guides/<country>/<provider>.epg.xml.gz
# ─────────────────────────────────────────────────────────────────────────────


# XMLTV source feeds to download
# Add as many as you need; the script fetches all of them each run.
#
# TIP: If a URL returns no channels, run the discover tool to inspect it:
#   python generate_epg.py --discover <url>
# That will print every channel ID in the feed so you can match them below.
sources:
  # Your IPTV provider's M3U Plus URL — EPG URL is auto-extracted from the header.
  # The URL contains credentials so it lives in .env (never committed to the repo).
  #
  # In .env put:
  #   M3U_URL=https://yourprovider.com/get.php?username=...&password=...&type=m3u_plus
  #
  # For GitHub Actions, add M3U_URL as a repository secret (Settings → Secrets).
  - label: "IPTV provider"
    m3u_url: "${M3U_URL}"

  # ── Fallback / additional sources (direct EPG URLs, no credentials needed) ─
  # - label: "iptv-org UK (tvguide)"
  #   url: "https://iptv-org.github.io/epg/guides/uk/tvguide.co.uk.epg.xml.gz"
  #
  # ── Other countries ──────────────────────────────────────────────────────────
  # - label: "iptv-org US"
  #   url: "https://iptv-org.github.io/epg/guides/us/tvguide.com.epg.xml.gz"


# ─────────────────────────────────────────────────────────────────────────────
# LIVE CHANNELS
# channel_id must exactly match the id attribute in the source XMLTV feed.
# Use --discover to find the right id for your channels.
# ─────────────────────────────────────────────────────────────────────────────
